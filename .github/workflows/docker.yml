name: Build and push Docker images to ECR

# Builds the backend, agent and frontend images for linux/amd64 + linux/arm64
# and pushes them to <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/aws300/public
# as :assistantx-backend / :assistantx-agent / :assistantx-frontend — the tags
# charts/values.yaml deploys.
#
# AWS_ACCOUNT_ID and AWS_REGION are variables of the "production" environment
# (Settings → Environments → production). AWS_ROLE_NAME may override the
# assumed role (default nxdev-GithubActions, which trusts repo:aws300/*).

on:
  push:
    tags:
      - docker*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        component: [backend, agent, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME || 'nxdev-GithubActions' }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Generated protobuf code is committed, so the images build without buf.
      - name: Build and push ${{ matrix.component }}
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/aws300/public:assistantx-${{ matrix.component }}
          COMPONENT: ${{ matrix.component }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE" --push "$COMPONENT"
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
