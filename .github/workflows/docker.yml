name: Build and push Docker images to ECR

on:
  push:
    tags:
      - docker*

env:
  # Set the repository variable AWS_ACCOUNT_ID (Settings → Secrets and variables → Actions → Variables).
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: us-west-2
  ECR_PUBLIC_REGISTRY: public.ecr.aws/b1y9i2f3
  ECR_PUBLIC_IMAGE: public.ecr.aws/b1y9i2f3/cnf

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          aws-region: us-east-1   # ECR public requires us-east-1 for auth

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: latest

      - name: Generate protobuf
        run: make -C protos

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'

      - name: Build and push backend image
        run: |
          IMAGE="${{ env.ECR_PUBLIC_IMAGE }}:backend"
          docker build -t "$IMAGE" backend/
          docker push "$IMAGE"

      - name: Build and push frontend image
        run: |
          IMAGE="${{ env.ECR_PUBLIC_IMAGE }}:frontend"
          docker build -t "$IMAGE" frontend/
          docker push "$IMAGE"
