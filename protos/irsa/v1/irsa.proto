syntax = "proto3";
package irsa.v1;
option go_package = "github.com/assistantx/backend/pkg/pb/irsa/v1;irsav1";

service IRSAService {
  rpc GetIRSAInfo(GetIRSAInfoRequest) returns (IRSAInfo);
}
message GetIRSAInfoRequest {}
message CallerIdentity { string account = 1; string user_id = 2; string arn = 3; }
message RoleInfo { string role_name = 1; string role_arn = 2; string role_id = 3; string description = 4; string create_date = 5; }
message PolicyInfo { string policy_name = 1; string policy_arn = 2; }
message IRSAInfo { CallerIdentity caller_identity = 1; RoleInfo role_info = 2; repeated PolicyInfo attached_policies = 3; repeated string inline_policy_names = 4; string error = 5; }
