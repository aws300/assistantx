version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/assistantx/backend/pkg/pb

plugins:
  # Go: protobuf message types
  - local: protoc-gen-go
    out: ../backend/pkg/pb
    opt:
      - paths=source_relative

  # Go: Connect-Go server/client stubs
  - local: protoc-gen-connect-go
    out: ../backend/pkg/pb
    opt:
      - paths=source_relative

  # TypeScript: protobuf message types + Connect-ES service schemas
  # (Connect-ES v2 generates service schemas directly into *_pb.ts —
  #  the legacy protoc-gen-connect-es plugin is no longer required.)
  - local: protoc-gen-es
    out: ../frontend/src/gen
    opt:
      - target=ts
    include_imports: true
