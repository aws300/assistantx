global:
  gateway: eg
  gatewayNamespace: envoy-gateway-system
  # httpsListenerName: restricts backend HTTPRoute to this Gateway HTTPS listener,
  # preventing it from matching other HTTPS ports (e.g. :7883).
  httpsListenerName: "https"

assistantx:
  enabled: true
  # existingSecretName: bring your own Secret instead of letting the chart render
  # credentials from these values — for External Secrets Operator, Sealed Secrets,
  # or AWS Secrets Manager. It must supply three keys: backend-config.yaml,
  # agent-config.yaml and livekit-config.yaml. When set, the chart renders no
  # Secret of its own and config.auth / config.livekit.apiKey / apiSecret are unused.
  existingSecretName: ""
  image:
    backend: ghcr.io/aws300/deploy:assistantx-backend
    agent: ghcr.io/aws300/deploy:assistantx-agent
    frontend: ghcr.io/aws300/deploy:assistantx-frontend
  host:
    frontend: assistantx.nx.run
    # backend: when set, backend RPCs are served on this hostname (separate domain).
    # Leave empty to share host.frontend via path-based routing.
    backend: "assistantxapi.nx.run"
  # corsAllowedOrigins: extra browser origins allowed to call the backend
  # cross-origin. https://<host.frontend> is always allowed; "*" is ignored.
  corsAllowedOrigins: []
  config:
    # OIDC DSN — REQUIRED, and intentionally empty: it embeds a client secret, so it
    # must never be committed. Supply it at install time:
    #   --set-string assistantx.config.auth="oidc://CLIENT_ID:CLIENT_SECRET@ISSUER?scope=..."
    # or via a private values file, or bring your own Secret with
    #   --set assistantx.existingSecretName=my-assistantx-secret
    #
    # Format: oidc://CLIENT_ID:CLIENT_SECRET@ISSUER_HOST/PATH?scope=<url-encoded>
    # Add oidc_logout=false for providers (e.g. Cognito) that expose a non-standard
    # logout_uri endpoint instead of RP-initiated end_session.
    auth: ""
    livekit:
      # url is derived automatically as wss://<host.backend>:7883
      # REQUIRED, and intentionally empty — these are credentials and must not be
      # committed. Supply them at install time:
      #   --set-string assistantx.config.livekit.apiKey=APIxxxxxxxxxxxx
      #   --set-string assistantx.config.livekit.apiSecret=<random 32+ bytes>
      # The chart renders them into a Secret and the in-cluster LiveKit server
      # keys itself from the same pair, so they only need to agree with each other.
      apiKey: ""
      apiSecret: ""
      agentName: "AssistantX"
      voiceMode: "realtime"
      novaSonic:
        modelVersion: "nova-sonic-2"
        voice: "tiffany"
        region: "us-east-1"
        turnDetection: "MEDIUM"
        realtimeOnly: true
      stt:
        baseUrl: "http://devgpu.nx.run:8000/v1"
        apiKey: "not-needed"
      llm:
        # provider: "bedrock" (direct via IRSA) or "litellm_proxy" (via LiteLLM server)
        provider: "bedrock"
        model: "bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0"
        region: "us-west-2"
        baseUrl: ""
        apiKey: ""
      tts:
        model: "cosyvoice-v3"
        # CosyVoice built-in speaker id (an external identifier); only used in "traditional" voice mode
        voice: "中文女"
        baseUrl: "http://devgpu.nx.run:9880/v1"
        apiKey: "not-needed"
      knowledgeBase:
        id: "FHRCYNULOS"
        region: "us-west-2"
        description: "EV charger questions, including how to use the charger, operating guides, charging fees, billing, troubleshooting, FAQs, charging safety precautions and charger technical specifications"
  # irsaRoleArn: when set, creates a ServiceAccount annotated with eks.amazonaws.com/role-arn
  # and binds it to the backend Deployment for IRSA credential injection.
  # PodRole from CloudFormation stack "nx" — carries the Bedrock (Nova Sonic,
  # Knowledge Base, AgentCore Memory) permissions the agent needs, trusted by
  # the nxdev EKS OIDC provider.
  irsaRoleArn: "arn:aws:iam::131166810173:role/nxdev-PodRole"

  # livekitServer: deploy LiveKit server in-cluster (disabled by default).
  # When enabled, uses config.livekit.apiKey/apiSecret for the server keys.
  # Ports:
  #   :7883 WSS signaling  — Envoy HTTPS listener (you configure)
  #   :7881 WebRTC TCP     — Envoy TCP listener   (you configure)
  livekitServer:
    image: livekit/livekit-server:v1.9
    # nodeIp: external IP advertised in WebRTC ICE TCP candidates (NAT 1:1 mapping).
    # Set to the LoadBalancer/Global Accelerator IPv4 address reachable on :7881.
    # This MUST be a static IP of the "nxdev" Global Accelerator that fronts
    # assistantxapi.nx.run (TCP :7881 -> Envoy NLB -> LiveKit :7881). Using an IP
    # that is not owned by that GA makes public WebRTC fail (browser gets an
    # unreachable ICE candidate) while in-cluster still works.
    # Static IPv4 of the "nxdev" Global Accelerator (TCP :7881 -> Envoy NLB -> LiveKit :7881).
    nodeIp: "166.117.104.189"

