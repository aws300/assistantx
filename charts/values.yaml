global:
  gateway: eg
  gatewayNamespace: envoy-gateway-system
  # httpsListenerName: restricts backend HTTPRoute to this Gateway HTTPS listener,
  # preventing it from matching other HTTPS ports (e.g. :7883).
  httpsListenerName: "https"

assistantx:
  enabled: true
  image:
    backend: public.ecr.aws/r0l7m8u0/assistantx:backend
    agent: public.ecr.aws/r0l7m8u0/assistantx:agent
    frontend: public.ecr.aws/r0l7m8u0/assistantx:frontend
  host:
    frontend: assistantx.nx.run
    # backend: when set, backend RPCs are served on this hostname (separate domain).
    # Leave empty to share host.frontend via path-based routing.
    backend: "assistantxapi.nx.run"
  config:
    # OIDC provider: AWS Cognito user pool us-west-2_uXkPGK5dS (CloudFormation stack "nx").
    # App client "assistantx-app" — callbacks registered for https://assistantx.nx.run/auth/oidc/callback.
    # oidc_logout=false: Cognito exposes a non-standard /logout endpoint (logout_uri) rather
    # than RP-initiated end_session with post_logout_redirect_uri.
    auth: "oidc://1k7hr0fv9h5235unvt4qglbnr4:1v900s79uu7hbo0tl33hkvv8ok0f311bmigetbaqo482aik9blpg@cognito-idp.us-west-2.amazonaws.com/us-west-2_uXkPGK5dS?scope=openid%20profile%20email&oidc_logout=false"
    livekit:
      # url is derived automatically as wss://<host.backend>:7883
      # WARNING: These are default credentials for development only.
      # Production deployments MUST override via --set or sealed secrets.
      # DO NOT commit real production credentials to this file.
      apiKey: "API61044af542dd01"
      apiSecret: "dadb51c033c967341bcff8348b9fd4c2261e0ff63178a6014ed26f803af798a6"
      agentName: "AssistantX"
      voiceMode: "realtime"
      novaSonic:
        modelVersion: "nova-sonic-2"
        voice: "tiffany"
        region: "us-east-1"
        turnDetection: "MEDIUM"
        realtimeOnly: true
      stt:
        baseUrl: "http://devgpu.nx.run:8000/v1"
        apiKey: "not-needed"
      llm:
        # provider: "bedrock" (direct via IRSA) or "litellm_proxy" (via LiteLLM server)
        provider: "bedrock"
        model: "bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0"
        region: "us-west-2"
        baseUrl: ""
        apiKey: ""
      tts:
        model: "cosyvoice-v3"
        voice: "中文女"
        baseUrl: "http://devgpu.nx.run:9880/v1"
        apiKey: "not-needed"
      knowledgeBase:
        id: "FHRCYNULOS"
        region: "us-west-2"
        description: "充电桩相关问题，包括充电桩使用方法、操作指南、充电费用、计费方式、故障排除、常见问题、充电安全注意事项、充电桩技术规格等"
  # irsaRoleArn: when set, creates a ServiceAccount annotated with eks.amazonaws.com/role-arn
  # and binds it to the backend Deployment for IRSA credential injection.
  # PodRole from CloudFormation stack "nx" — carries the Bedrock (Nova Sonic,
  # Knowledge Base, AgentCore Memory) permissions the agent needs, trusted by
  # the nxdev EKS OIDC provider.
  irsaRoleArn: "arn:aws:iam::131166810173:role/nxdev-PodRole"

  # livekitServer: deploy LiveKit server in-cluster (disabled by default).
  # When enabled, uses config.livekit.apiKey/apiSecret for the server keys.
  # Ports:
  #   :7883 WSS signaling  — Envoy HTTPS listener (you configure)
  #   :7881 WebRTC TCP     — Envoy TCP listener   (you configure)
  livekitServer:
    image: livekit/livekit-server:v1.9
    # nodeIp: external IP advertised in WebRTC ICE TCP candidates (NAT 1:1 mapping).
    # Set to the LoadBalancer/Global Accelerator IPv4 address reachable on :7881.
    # This MUST be a static IP of the "nxdev" Global Accelerator that fronts
    # assistantxapi.nx.run (TCP :7881 -> Envoy NLB -> LiveKit :7881). Using an IP
    # that is not owned by that GA makes public WebRTC fail (browser gets an
    # unreachable ICE candidate) while in-cluster still works.
    # Static IPv4 of the "nxdev" Global Accelerator (TCP :7881 -> Envoy NLB -> LiveKit :7881).
    nodeIp: "166.117.104.189"

