global:
  gateway: eg
  gatewayNamespace: envoy-gateway-system
  # httpsListenerName: restricts backend HTTPRoute to this Gateway HTTPS listener,
  # preventing it from matching other HTTPS ports (e.g. :7883).
  httpsListenerName: "https"

assistantx:
  enabled: true
  image:
    backend: public.ecr.aws/b1y9i2f3/assistantx:backend
    agent: public.ecr.aws/b1y9i2f3/assistantx:agent
    frontend: public.ecr.aws/b1y9i2f3/assistantx:frontend
  host:
    frontend: assistantx.nx.run
    # backend: when set, backend RPCs are served on this hostname (separate domain).
    # Leave empty to share host.frontend via path-based routing.
    backend: "assistantxapi.nx.run"
  config:
    auth: "oidc://u5HewIf9_gccM3O5Q-nwAA:@account.nx.run?scope=offline%20profile%20%20email%20%20openid"
    livekit:
      # url is derived automatically as wss://<host.backend>:7883
      apiKey: "REDACTED-LIVEKIT-API-KEY"
      apiSecret: "REDACTED-LIVEKIT-API-SECRET"
      agentName: "AssistantX"
      voiceMode: "realtime"
      novaSonic:
        modelVersion: "nova-sonic-2"
        voice: "tiffany"
        region: "us-east-1"
        turnDetection: "MEDIUM"
        realtimeOnly: true
      stt:
        baseUrl: "http://devgpu.nx.run:8000/v1"
        apiKey: "not-needed"
      llm:
        # provider: "bedrock" (direct via IRSA) or "litellm_proxy" (via LiteLLM server)
        provider: "bedrock"
        model: "bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0"
        region: "us-west-2"
        baseUrl: ""
        apiKey: ""
      tts:
        model: "cosyvoice-v3"
        voice: "中文女"
        baseUrl: "http://devgpu.nx.run:9880/v1"
        apiKey: "not-needed"
      knowledgeBase:
        id: "FHRCYNULOS"
        region: "us-west-2"
        description: "充电桩相关问题，包括充电桩使用方法、操作指南、充电费用、计费方式、故障排除、常见问题、充电安全注意事项、充电桩技术规格等"
  # irsaRoleArn: when set, creates a ServiceAccount annotated with eks.amazonaws.com/role-arn
  # and binds it to the backend Deployment for IRSA credential injection.
  irsaRoleArn: "arn:aws:iam::867344450900:role/NxlabsEKS_JumpRole"

  # livekitServer: deploy LiveKit server in-cluster (disabled by default).
  # When enabled, uses config.livekit.apiKey/apiSecret for the server keys.
  # Ports:
  #   :7883 WSS signaling  — Envoy HTTPS listener (you configure)
  #   :7881 WebRTC TCP     — Envoy TCP listener   (you configure)
  livekitServer:
    image: livekit/livekit-server:v1.9
    # nodeIp: external IP advertised in WebRTC ICE TCP candidates (NAT 1:1 mapping).
    # Set to the LoadBalancer/Global Accelerator IPv4 address reachable on :7881.
    nodeIp: "166.117.138.22"

