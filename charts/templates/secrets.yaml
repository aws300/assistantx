{{- if .Values.assistantx.enabled }}
# ============================================================
# AssistantX Secrets
#
# Contains sensitive credentials for LiveKit and LiteLLM.
# Values are base64-encoded by Kubernetes automatically.
#
# Production deployments should:
# - Use Sealed Secrets, External Secrets Operator, or AWS Secrets Manager
# - Override via: helm install --set assistantx.config.livekit.apiKey=xxx
# - Never commit real credentials to values.yaml
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: assistantx-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # LiveKit server API credentials (used by backend, agent, and livekit-server)
  livekit-api-key: {{ .Values.assistantx.config.livekit.apiKey | default "CHANGE_ME" | quote }}
  livekit-api-secret: {{ .Values.assistantx.config.livekit.apiSecret | default "CHANGE_ME" | quote }}
  {{- if .Values.assistantx.config.livekit.llm.apiKey }}
  # LiteLLM proxy API key (used by agent when provider is litellm_proxy)
  litellm-api-key: {{ .Values.assistantx.config.livekit.llm.apiKey | quote }}
  {{- end }}
{{- end }}
