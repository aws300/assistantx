{{- if .Values.assistantx.enabled }}
{{- $cfg := .Values.assistantx.config.livekit }}
{{- $srv := .Values.assistantx.livekitServer }}
# ============================================================
# AssistantX credentials
#
# The backend, agent, and LiveKit server each read a config file that embeds
# credentials (OIDC client secret, LiveKit API key/secret, LiteLLM key). Those
# files are rendered into Secrets rather than ConfigMaps so no credential is
# ever stored in a plaintext cluster object.
#
# Nothing here has a credential default: values.yaml ships the sensitive fields
# empty, so they must be supplied at install time via one of
#   --set assistantx.config.livekit.apiSecret=...
#   --values my-secrets.yaml            (keep that file out of git)
#   --set assistantx.existingSecretName=...
#
# existingSecretName skips every Secret below so External Secrets Operator,
# Sealed Secrets, or AWS Secrets Manager can own the material instead. Such a
# Secret must supply the same three keys used here: backend-config.yaml,
# agent-config.yaml and livekit-config.yaml.
# ============================================================
{{- if not .Values.assistantx.existingSecretName }}
{{- $auth := required "assistantx.config.auth is required (OIDC DSN). It is intentionally empty in values.yaml because it embeds a client secret — pass it with --set or a private values file." .Values.assistantx.config.auth }}
{{- $lkKey := required "assistantx.config.livekit.apiKey is required — pass it with --set or a private values file." $cfg.apiKey }}
{{- $lkSecret := required "assistantx.config.livekit.apiSecret is required — pass it with --set or a private values file." $cfg.apiSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: assistantx-backend-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.yaml: |
    dependencies:
      auth: {{ $auth | quote }}
    livekit:
      url: {{ printf "wss://%s:7883" .Values.assistantx.host.backend | quote }}
      apiKey: {{ $lkKey | quote }}
      apiSecret: {{ $lkSecret | quote }}
      agentName: {{ $cfg.agentName | default "Assistant" | quote }}
      skillsDir: "/app/skills/devices"
    apis:
      httpAddr: ":8080"
      grpcAddr: ":8081"
      metricsAddr: ":9090"
---
apiVersion: v1
kind: Secret
metadata:
  name: assistantx-agent-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.yaml: |
    livekit:
      # The agent reaches LiveKit over the in-cluster Service: routing it through
      # Envoy produces stun:host:port/path ICE URLs that LiveKit rejects.
      url: "ws://assistantx-livekit:7880"
      api_key: {{ $lkKey | quote }}
      api_secret: {{ $lkSecret | quote }}
    voice_mode: {{ $cfg.voiceMode | default "realtime" | quote }}
    nova_sonic:
      model_version: {{ $cfg.novaSonic.modelVersion | default "nova-sonic-2" | quote }}
      voice: {{ $cfg.novaSonic.voice | default "tiffany" | quote }}
      region: {{ $cfg.novaSonic.region | default "us-east-1" | quote }}
      turn_detection: {{ $cfg.novaSonic.turnDetection | default "MEDIUM" | quote }}
      realtime_only: {{ $cfg.novaSonic.realtimeOnly | default true }}
    agent:
      name: {{ $cfg.agentName | default "Assistant" | quote }}
      instructions: |
        你是一个智能语音助手。
        规则：
        - 用简洁、自然的中文回答问题
        - 不要使用表情符号、星号、markdown或特殊字符
        - 保持回答简短、友好、有帮助
        - 当用户请求控制设备功能时，使用相应的工具执行操作
    stt:
      model: "whisper-1"
      base_url: {{ $cfg.stt.baseUrl | default "" | quote }}
      api_key: {{ $cfg.stt.apiKey | default "not-needed" | quote }}
      language: "zh"
    llm:
      provider: {{ $cfg.llm.provider | default "bedrock" | quote }}
      model: {{ $cfg.llm.model | default "" | quote }}
      region: {{ $cfg.llm.region | default "us-west-2" | quote }}
      {{- if $cfg.llm.baseUrl }}
      base_url: {{ $cfg.llm.baseUrl | quote }}
      {{- end }}
      {{- if $cfg.llm.apiKey }}
      api_key: {{ $cfg.llm.apiKey | quote }}
      {{- end }}
    tts:
      model: {{ $cfg.tts.model | default "" | quote }}
      voice: {{ $cfg.tts.voice | default "" | quote }}
      base_url: {{ $cfg.tts.baseUrl | default "" | quote }}
      api_key: {{ $cfg.tts.apiKey | default "not-needed" | quote }}
      response_format: "pcm"
    session:
      preemptive_generation: true
      resume_false_interruption: true
      false_interruption_timeout: 1.0
    skills:
      base_path: "skills/devices"
    {{- if $cfg.knowledgeBase }}
    knowledge_base:
      id: {{ $cfg.knowledgeBase.id | default "" | quote }}
      region: {{ $cfg.knowledgeBase.region | default "us-west-2" | quote }}
      description: {{ $cfg.knowledgeBase.description | default "" | quote }}
    {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: assistantx-livekit-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      use_external_ip: false
      stun_servers: []
      {{- if $srv.nodeIp }}
      node_ip: {{ $srv.nodeIp | quote }}
      {{- end }}
    keys:
      {{ $lkKey }}: {{ $lkSecret }}
    logging:
      level: info
      pion_level: error
{{- end }}
{{- end }}
