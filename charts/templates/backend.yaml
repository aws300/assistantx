# The backend config embeds the OIDC client secret and the LiveKit API secret,
# so it is rendered as a Secret in secrets.yaml rather than a ConfigMap here.
apiVersion: v1
kind: Service
metadata:
  name: assistantx-backend
spec:
  selector:
    app: assistantx-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistantx-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistantx-backend
  template:
    metadata:
      labels:
        app: assistantx-backend
    spec:
      {{- if .Values.assistantx.irsaRoleArn }}
      serviceAccountName: assistantx-backend
      {{- end }}
      # The image runs as uid 1000 (non-root), so the mounted config Secret is
      # group-owned by fsGroup and mounted 0440 — readable by the app, and by
      # nothing else in the pod.
      securityContext:
        fsGroup: 1000
      containers:
        - name: assistantx-backend
          image: {{ .Values.assistantx.image.backend }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.assistantx.existingSecretName | default "assistantx-backend-config" }}
            {{- if .Values.assistantx.existingSecretName }}
            items:
              - key: backend-config.yaml
                path: config.yaml
            {{- end }}
            defaultMode: 0440
