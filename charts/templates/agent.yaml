{{- if .Values.assistantx.config.livekit }}
# The agent config embeds the LiveKit API secret (and optionally a LiteLLM key),
# so it is rendered as a Secret in secrets.yaml rather than a ConfigMap here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistantx-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistantx-agent
  template:
    metadata:
      labels:
        app: assistantx-agent
    spec:
      {{- if .Values.assistantx.irsaRoleArn }}
      serviceAccountName: assistantx-backend
      {{- end }}
      # The image runs as uid 1000 (non-root), so the mounted config Secret is
      # group-owned by fsGroup and mounted 0440 — readable by the app, and by
      # nothing else in the pod.
      securityContext:
        fsGroup: 1000
      containers:
        - name: assistantx-agent
          image: {{ .Values.assistantx.image.agent }}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.assistantx.existingSecretName | default "assistantx-agent-config" }}
            {{- if .Values.assistantx.existingSecretName }}
            items:
              - key: agent-config.yaml
                path: config.yaml
            {{- end }}
            defaultMode: 0440
{{- end }}
