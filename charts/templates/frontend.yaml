apiVersion: v1
kind: Service
metadata:
  name: assistantx-frontend
spec:
  selector:
    app: assistantx-frontend
  ports:
    # The Service keeps port 80 so the HTTPRoute backendRef is unchanged, and
    # targets 8080 in the pod, where nginx runs as a non-root user.
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistantx-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistantx-frontend
  template:
    metadata:
      labels:
        app: assistantx-frontend
    spec:
      containers:
        - name: assistantx-frontend
          image: {{ .Values.assistantx.image.frontend }}
          imagePullPolicy: Always
          env:
            - name: BACKEND_URL
              value: {{ if $.Values.assistantx.host.backend }}"https://{{ $.Values.assistantx.host.backend }}"{{ else }}""{{ end }}
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
