# Listens on 8080: an unprivileged port, so the server runs as a non-root user
# without CAP_NET_BIND_SERVICE. The chart's Service maps 80 -> 8080, so the
# in-cluster contract (and the HTTPRoute backendRef) stays on port 80.
server {
    listen 8080;
    listen [::]:8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Every location includes the security headers itself: nginx drops
    # server-level add_header directives in a location that sets its own.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }
}
