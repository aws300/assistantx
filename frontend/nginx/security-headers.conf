# Content-Security-Policy:
# - script-src: same-origin only. Runtime config is served as /config.js rather
#   than an inline script, so no 'unsafe-inline' is needed.
# - 'wasm-unsafe-eval' + blob: workers: onnxruntime-web (wake word) and the
#   LiveKit noise filter compile WebAssembly and spawn workers.
# - style-src 'unsafe-inline': Solid components set inline styles.
# - connect-src https:/wss:: backend API, LiveKit signaling and the OIDC
#   provider live on other origins that are only known at deploy time.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' https: wss: blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
