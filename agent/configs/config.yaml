# Assistant Agent Configuration

livekit:
  url: "wss://livekit.nx.run"
  api_key: "CHANGE_ME"
  api_secret: "CHANGE_ME"

# Voice mode: "realtime" (Nova Sonic) or "traditional" (STT+LLM+TTS)
voice_mode: "realtime"

# Nova Sonic configuration (only used when voice_mode is "realtime")
nova_sonic:
  model_version: "nova-sonic-2"
  voice: "tiffany"
  region: "us-east-1"
  turn_detection: "MEDIUM"
  realtime_only: true

agent:
  name: "AssistantX"
  instructions: |
    You are a helpful voice assistant.

    Rules:
    - Answer in concise, natural English
    - Do not use emoji, asterisks, markdown or special characters
    - Keep answers short, friendly and helpful
    - When the user asks to control a device, use the matching tool to perform the action

stt:
  model: "whisper-1"
  base_url: "http://devgpu.nx.run:8000/v1"
  api_key: "not-needed"
  language: "en"

# LLM configuration
# provider: "bedrock" (direct AWS Bedrock via IRSA) or "litellm_proxy" (via LiteLLM server)
#
# bedrock mode:   Uses boto3/litellm locally, authenticates via IRSA credentials.
#                 No base_url needed. Model must use bedrock/ prefix.
#
# litellm_proxy:  Routes through an external LiteLLM proxy server.
#                 Requires base_url and api_key.
llm:
  provider: "litellm_proxy"
  model: "bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0"
  region: "us-west-2"
  base_url: "http://litellm.aws300.svc.cluster.local:8080/v1"
  api_key: "CHANGE_ME"

tts:
  model: "cosyvoice-v3"
  # CosyVoice built-in speaker id (an external identifier, not UI text); only used in "traditional" voice mode
  voice: "中文女"
  base_url: "http://devgpu.nx.run:9880/v1"
  api_key: "not-needed"
  response_format: "pcm"

session:
  preemptive_generation: true
  resume_false_interruption: true
  false_interruption_timeout: 1.0

skills:
  base_path: "skills/devices"

knowledge_base:
  id: "FHRCYNULOS"
  region: "us-west-2"
  description: "EV charger questions, including how to use the charger, operating guides, charging fees, billing, troubleshooting, FAQs, charging safety precautions and charger technical specifications"
