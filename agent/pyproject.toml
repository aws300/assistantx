[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "1.0.0"
description = "AssistantX LiveKit voice agent"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.6.8",
    "livekit-plugins-openai>=1.6.8",
    "livekit-plugins-silero>=1.6.8",
    "livekit-plugins-turn-detector>=1.6.8",
    "livekit-plugins-aws[realtime]>=1.6.8",
    "opencc-python-reimplemented>=0.1.7",
    "pyyaml>=6.0",
    "aiohttp>=3.14.3",
    "boto3>=1.34.0",
]

[project.scripts]
agent = "lkagent.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lkagent"]
