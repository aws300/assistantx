metadata:
  device_type: vehicle
  device_name: "Smart Cockpit"
  version: "1.0.0"
  language: en-US
  description: "Skill configuration for the in-car voice control system"

settings:
  session_timeout_minutes: 5
  confirmation_required: false
  default_zone: "driver"

categories:
  - id: hvac
    name: "Climate Control"
    icon: "thermometer"
    description: "Temperature, fan speed and A/C mode control"
  - id: windows
    name: "Window Control"
    icon: "square"
    description: "Open and close windows and the sunroof"
  - id: seats
    name: "Seat Control"
    icon: "armchair"
    description: "Seat heating, ventilation and position"
  - id: lighting
    name: "Lighting Control"
    icon: "lightbulb"
    description: "Interior and ambient lighting"
  - id: media
    name: "Media Control"
    icon: "music"
    description: "Volume and audio source control"
  - id: info
    name: "Vehicle Info"
    icon: "info"
    description: "Vehicle status queries"
  - id: session
    name: "Session Control"
    icon: "power"
    description: "Voice session management, such as exiting or closing"

skills:
  - id: hvac.set_temperature
    category: hvac
    name: "Set Temperature"
    description: "Set the cabin A/C temperature, with per-zone control"
    triggers:
      - "set the temperature to {temperature} degrees"
      - "temperature {temperature}"
      - "A/C to {temperature} degrees"
    parameters:
      - name: temperature
        type: number
        required: true
        min: 16
        max: 30
        unit: "°C"
      - name: zone
        type: enum
        required: false
        default: "all"
        options:
          - value: "all"
            aliases: ["all", "everyone"]
          - value: "driver"
            aliases: ["driver", "driver side"]
          - value: "passenger"
            aliases: ["passenger", "passenger side"]
    action:
      id: "hvac.setTemperature"
      payload_template:
        temperature: "${temperature}"
        zone: "${zone}"
    responses:
      success: "OK, the ${zone} temperature is set to ${temperature} degrees"

  - id: hvac.toggle_ac
    category: hvac
    name: "A/C On/Off"
    description: "Turn the A/C on or off"
    triggers:
      - "turn on the A/C"
      - "turn off the A/C"
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["turn on", "on"]
          - value: "off"
            aliases: ["turn off", "off"]
    action:
      id: "hvac.toggleAC"
      payload_template:
        action: "${action}"
    responses:
      success: "OK, the A/C is ${action}"

  - id: hvac.set_fan_speed
    category: hvac
    name: "Set Fan Speed"
    description: "Set the A/C fan speed"
    triggers:
      - "set the fan to level {speed}"
      - "more air"
      - "less air"
    parameters:
      - name: speed
        type: enum
        required: true
        options:
          - value: "auto"
            aliases: ["auto"]
          - value: "1"
            aliases: ["level one", "low"]
          - value: "2"
            aliases: ["level two", "medium"]
          - value: "3"
            aliases: ["level three", "high"]
    action:
      id: "hvac.setFanSpeed"
      payload_template:
        speed: "${speed}"
    responses:
      success: "OK, the fan speed is set to ${speed}"

  - id: hvac.get_temperature
    category: hvac
    name: "Check Temperature"
    description: "Get the current cabin A/C temperature setting and the outside temperature"
    triggers:
      - "what is the A/C temperature"
      - "what's the temperature now"
      - "cabin temperature"
      - "how warm is it"
      - "check the temperature"
    parameters: []
    action:
      id: "hvac.getTemperature"
      payload_template: {}
    responses:
      success: "The cabin is ${current} degrees, the target is ${target} degrees, and it is ${outside} degrees outside"

  - id: windows.control
    category: windows
    name: "Window Control"
    description: "Open or close the windows"
    triggers:
      - "open the {window} window"
      - "close the {window} window"
      - "open the windows"
      - "close the windows"
    parameters:
      - name: window
        type: enum
        required: false
        default: "all"
        options:
          - value: "all"
            aliases: ["all", "every"]
          - value: "front_left"
            aliases: ["front left", "driver"]
          - value: "front_right"
            aliases: ["front right", "passenger"]
          - value: "sunroof"
            aliases: ["sunroof"]
      - name: action
        type: enum
        required: true
        options:
          - value: "open"
            aliases: ["open"]
          - value: "close"
            aliases: ["close", "shut"]
      - name: position
        type: number
        required: false
        min: 0
        max: 100
        default: 100
    action:
      id: "windows.control"
      payload_template:
        window: "${window}"
        action: "${action}"
        position: "${position}"
    responses:
      success: "OK, the ${window} window is ${action}"

  - id: seats.heating
    category: seats
    name: "Seat Heating"
    description: "Control seat heating"
    triggers:
      - "turn on seat heating"
      - "turn off seat heating"
      - "seat heating level {level}"
    parameters:
      - name: seat
        type: enum
        required: false
        default: "driver"
        options:
          - value: "driver"
            aliases: ["driver", "driver seat"]
          - value: "passenger"
            aliases: ["passenger", "passenger seat"]
      - name: level
        type: number
        required: false
        min: 0
        max: 3
        default: 2
    action:
      id: "seats.setHeating"
      payload_template:
        seat: "${seat}"
        level: "${level}"
    responses:
      success: "OK, ${seat} seat heating is set to level ${level}"

  - id: seats.cooling
    category: seats
    name: "Seat Ventilation"
    description: "Control seat ventilation"
    triggers:
      - "turn on seat ventilation"
      - "turn off seat ventilation"
    parameters:
      - name: seat
        type: enum
        required: false
        default: "driver"
        options:
          - value: "driver"
            aliases: ["driver", "driver seat"]
          - value: "passenger"
            aliases: ["passenger", "passenger seat"]
      - name: level
        type: number
        required: false
        min: 0
        max: 3
        default: 2
    action:
      id: "seats.setCooling"
      payload_template:
        seat: "${seat}"
        level: "${level}"
    responses:
      success: "OK, ${seat} seat ventilation is set to level ${level}"

  - id: lighting.interior
    category: lighting
    name: "Interior Lights"
    description: "Control the interior lights"
    triggers:
      - "turn on the interior lights"
      - "turn off the interior lights"
      - "lights on"
      - "lights off"
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["turn on", "on"]
          - value: "off"
            aliases: ["turn off", "off"]
      - name: brightness
        type: number
        required: false
        min: 0
        max: 100
    action:
      id: "lighting.setInterior"
      payload_template:
        action: "${action}"
        brightness: "${brightness}"
    responses:
      success: "OK, the interior lights are ${action}"

  - id: lighting.ambient
    category: lighting
    name: "Ambient Lighting"
    description: "Control ambient light color and brightness"
    triggers:
      - "set the ambient light to {color}"
      - "turn on the ambient light"
      - "turn off the ambient light"
    parameters:
      - name: action
        type: enum
        required: false
        default: "set"
        options:
          - value: "on"
            aliases: ["turn on", "on"]
          - value: "off"
            aliases: ["turn off", "off"]
          - value: "set"
            aliases: ["set", "change to"]
      - name: color
        type: enum
        required: false
        default: "#3B82F6"
        options:
          - value: "#3B82F6"
            aliases: ["blue"]
          - value: "#EF4444"
            aliases: ["red"]
          - value: "#22C55E"
            aliases: ["green"]
          - value: "#A855F7"
            aliases: ["purple"]
          - value: "#F97316"
            aliases: ["orange"]
          - value: "#EC4899"
            aliases: ["pink"]
          - value: "#6B7280"
            aliases: ["white"]
      - name: brightness
        type: number
        required: false
        min: 0
        max: 100
        default: 80
    action:
      id: "lighting.setAmbient"
      payload_template:
        action: "${action}"
        color: "${color}"
        brightness: "${brightness}"
    responses:
      success: "OK, the ambient light is set to ${color}"

  - id: media.volume
    category: media
    name: "Volume Control"
    description: "Adjust the media volume"
    triggers:
      - "set the volume to {level}"
      - "louder"
      - "quieter"
      - "mute"
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "set"
            aliases: ["set", "set to"]
          - value: "up"
            aliases: ["louder", "turn up"]
          - value: "down"
            aliases: ["quieter", "turn down"]
          - value: "mute"
            aliases: ["mute"]
      - name: level
        type: number
        required: false
        min: 0
        max: 100
    action:
      id: "media.setVolume"
      payload_template:
        action: "${action}"
        level: "${level}"
    responses:
      success: "OK, volume ${action}"

  - id: info.vehicle_status
    category: info
    name: "Vehicle Status"
    description: "Get the overall EV status, including battery level and remaining range"
    triggers:
      - "vehicle status"
      - "how is the car doing"
      - "battery level"
      - "how much charge is left"
      - "what's the range"
      - "how far can I go"
      - "remaining battery"
      - "battery status"
    parameters: []
    action:
      id: "info.getVehicleStatus"
      payload_template: {}
    responses:
      success: "Current speed is ${speed} kilometers per hour, battery is at ${battery}%, and the estimated range is ${range} kilometers"

  - id: session.exit
    category: session
    name: "Exit Session"
    description: "End the current voice session and disconnect"
    triggers:
      - "close"
      - "exit"
      - "dismiss"
      - "goodbye"
      - "bye bye"
      - "end the conversation"
      - "end the session"
      - "disconnect"
      - "close the voice assistant"
      - "exit voice"
      - "never mind"
      - "that's all"
      - "I'm done"
      - "quit"
      - "exit"
      - "turn off"
      - "bye"
    parameters: []
    action:
      id: "session.disconnect"
      payload_template:
        command: "disconnect"
    responses:
      success: "OK, goodbye!"

rag_queries:
  - id: vehicle_manual
    name: "Vehicle Manual Lookup"
    description: "Look up information in the vehicle owner's manual"
    knowledge_base_id: "FHRCYNULOS"
    region: "us-west-2"
    triggers:
      - "how do I {action}"
      - "where is the {feature}"
      - "how to use {feature}"
      - "how does {feature} work"
      - "tell me about {topic}"
    responses:
      success: "${answer}"
      not_found: "Sorry, I couldn't find that in the manual"
      error: "The lookup failed, please try again later"
