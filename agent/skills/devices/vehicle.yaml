rag_queries:
  - id: vehicle_manual
    name: "车辆手册查询"
    description: "查询车辆使用手册中的信息，回答用户关于车辆功能、操作方法的问题"
    knowledge_base_id: "FHRCYNULOS"
    region: "us-west-2"
    model_id: "anthropic.claude-sonnet-4-5-20250514-v1:0"
    
    triggers:
      - "怎么{action}"
      - "{feature}在哪里"
      - "如何使用{feature}"
      - "{feature}怎么用"
      - "告诉我关于{topic}"
      
    examples:
      - "怎么打开儿童锁"
      - "后备箱怎么开"
      - "如何连接蓝牙"
      - "自动泊车怎么用"
      - "车道保持功能在哪里"
      - "怎么设置自动大灯"
      
    responses:
      success: "${answer}"
      not_found: "抱歉，我在手册中没有找到相关信息"
      error: "查询出错，请稍后重试"

