# ============================================
# Vehicle Cockpit Control Skills
# 车载座舱语音控制技能配置
# ============================================
# This file defines all voice-controllable actions for the vehicle.
# To adapt for other IoT devices, create a new YAML file with similar structure.

metadata:
  device_type: vehicle
  device_name: "智能座舱"
  version: "1.0.0"
  language: zh-CN
  description: "车载语音控制系统技能配置"
  author: "Assistant Team"

# Global settings
settings:
  session_timeout_minutes: 5
  wake_word: "hey_jarvis"
  confirmation_required: false
  default_zone: "driver"

# Skill categories for UI organization
categories:
  - id: hvac
    name: "空调控制"
    icon: "thermometer"
    description: "温度、风速、空调模式控制"
    
  - id: windows
    name: "车窗控制"
    icon: "square"
    description: "车窗、天窗开关控制"
    
  - id: seats
    name: "座椅控制"
    icon: "armchair"
    description: "座椅加热、通风、位置调节"
    
  - id: lighting
    name: "灯光控制"
    icon: "lightbulb"
    description: "车内灯光、氛围灯控制"
    
  - id: media
    name: "媒体控制"
    icon: "music"
    description: "音量、音源控制"

  - id: info
    name: "信息查询"
    icon: "info"
    description: "车辆状态信息查询"

# ============================================
# Skill Definitions
# ============================================
skills:
  # ==========================================
  # HVAC Skills (空调控制)
  # ==========================================
  - id: hvac.set_temperature
    category: hvac
    name: "设置温度"
    description: "设置车内空调温度，支持分区控制"
    
    triggers:
      - "把温度调到{temperature}度"
      - "设置温度{temperature}"
      - "空调{temperature}度"
      - "调到{temperature}度"
      - "{zone}温度{temperature}度"
      
    parameters:
      - name: temperature
        type: number
        required: true
        min: 16
        max: 30
        unit: "°C"
        description: "目标温度（16-30°C）"
        
      - name: zone
        type: enum
        required: false
        default: "all"
        options:
          - value: "all"
            aliases: ["全部", "所有", "整车"]
          - value: "driver"
            aliases: ["驾驶位", "主驾", "我这边"]
          - value: "passenger"
            aliases: ["副驾驶", "副驾", "那边"]
          - value: "rear"
            aliases: ["后排", "后座"]
        description: "控制区域"
    
    action:
      id: "hvac.setTemperature"
      payload_template:
        temperature: "${temperature}"
        zone: "${zone}"
        
    responses:
      success: "好的，已将${zone}温度设置为${temperature}度"
      error: "抱歉，温度设置失败，请重试"

  - id: hvac.adjust_temperature
    category: hvac
    name: "调节温度"
    description: "相对调节温度（调高/调低）"
    
    triggers:
      - "调高温度"
      - "调低温度"
      - "温度高一点"
      - "温度低一点"
      - "热一点"
      - "冷一点"
      - "太热了"
      - "太冷了"
      
    parameters:
      - name: direction
        type: enum
        required: true
        options:
          - value: "up"
            aliases: ["调高", "高一点", "热一点", "太冷"]
          - value: "down"
            aliases: ["调低", "低一点", "冷一点", "太热"]
        description: "调节方向"
        
      - name: amount
        type: number
        required: false
        default: 2
        min: 1
        max: 5
        description: "调节幅度（度）"
    
    action:
      id: "hvac.adjustTemperature"
      payload_template:
        direction: "${direction}"
        amount: "${amount}"
        
    responses:
      success: "好的，已${direction}温度${amount}度"

  - id: hvac.get_temperature
    category: hvac
    name: "查询温度"
    description: "获取当前车内温度信息"
    
    triggers:
      - "现在温度多少"
      - "车内温度"
      - "空调温度"
      - "温度是多少"
      - "现在多少度"
      
    parameters: []
    
    action:
      id: "hvac.getTemperature"
      payload_template: {}
      
    returns:
      type: object
      properties:
        current:
          type: number
          description: "当前温度"
        target:
          type: number
          description: "目标温度"
        outside:
          type: number
          description: "车外温度"
        
    responses:
      success: "当前车内温度是${current}度，目标温度${target}度，车外温度${outside}度"

  - id: hvac.set_fan_speed
    category: hvac
    name: "设置风速"
    description: "设置空调风扇速度"
    
    triggers:
      - "风速调到{speed}档"
      - "风量{speed}"
      - "风大一点"
      - "风小一点"
      - "自动风速"
      
    parameters:
      - name: speed
        type: enum
        required: true
        options:
          - value: "auto"
            aliases: ["自动"]
          - value: "1"
            aliases: ["一档", "最小"]
          - value: "2"
            aliases: ["二档"]
          - value: "3"
            aliases: ["三档", "中等"]
          - value: "4"
            aliases: ["四档"]
          - value: "5"
            aliases: ["五档", "最大"]
        description: "风速档位"
    
    action:
      id: "hvac.setFanSpeed"
      payload_template:
        speed: "${speed}"
        
    responses:
      success: "好的，风速已设置为${speed}"

  - id: hvac.toggle_ac
    category: hvac
    name: "空调开关"
    description: "打开或关闭空调"
    
    triggers:
      - "打开空调"
      - "关闭空调"
      - "开空调"
      - "关空调"
      
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["打开", "开"]
          - value: "off"
            aliases: ["关闭", "关"]
        description: "开关动作"
    
    action:
      id: "hvac.toggleAC"
      payload_template:
        action: "${action}"
        
    responses:
      success: "好的，空调已${action}"

  # ==========================================
  # Window Skills (车窗控制)
  # ==========================================
  - id: windows.control
    category: windows
    name: "车窗控制"
    description: "打开或关闭车窗"
    
    triggers:
      - "打开{window}车窗"
      - "关闭{window}车窗"
      - "把{window}车窗开到{position}"
      - "开窗"
      - "关窗"
      - "打开天窗"
      - "关闭天窗"
      
    parameters:
      - name: window
        type: enum
        required: false
        default: "all"
        options:
          - value: "all"
            aliases: ["所有", "全部", "所有车窗"]
          - value: "front_left"
            aliases: ["左前", "驾驶位", "主驾", "我这边"]
          - value: "front_right"
            aliases: ["右前", "副驾驶", "副驾"]
          - value: "rear_left"
            aliases: ["左后", "后排左"]
          - value: "rear_right"
            aliases: ["右后", "后排右"]
          - value: "sunroof"
            aliases: ["天窗"]
        description: "车窗位置"
            
      - name: action
        type: enum
        required: true
        options:
          - value: "open"
            aliases: ["打开", "开"]
          - value: "close"
            aliases: ["关闭", "关"]
          - value: "set"
            aliases: ["设置", "调到"]
        description: "操作类型"
        
      - name: position
        type: number
        required: false
        min: 0
        max: 100
        default: 100
        unit: "%"
        description: "开启百分比（0=关闭，100=全开）"
    
    action:
      id: "windows.control"
      payload_template:
        window: "${window}"
        action: "${action}"
        position: "${position}"
    
    responses:
      success: "好的，${window}车窗已${action}"
      error: "车窗控制失败，请重试"

  # ==========================================
  # Seat Skills (座椅控制)
  # ==========================================
  - id: seats.heating
    category: seats
    name: "座椅加热"
    description: "控制座椅加热功能"
    
    triggers:
      - "打开座椅加热"
      - "关闭座椅加热"
      - "座椅加热{level}档"
      - "加热座椅"
      - "座椅暖一点"
      
    parameters:
      - name: seat
        type: enum
        required: false
        default: "driver"
        options:
          - value: "driver"
            aliases: ["驾驶位", "主驾", "我的"]
          - value: "passenger"
            aliases: ["副驾驶", "副驾"]
          - value: "rear_left"
            aliases: ["后排左"]
          - value: "rear_right"
            aliases: ["后排右"]
          - value: "all"
            aliases: ["全部", "所有"]
        description: "座椅位置"
        
      - name: level
        type: number
        required: false
        min: 0
        max: 3
        default: 2
        description: "加热档位（0=关闭，1-3=档位）"
    
    action:
      id: "seats.setHeating"
      payload_template:
        seat: "${seat}"
        level: "${level}"
        
    responses:
      success: "好的，${seat}座椅加热已设置为${level}档"

  - id: seats.cooling
    category: seats
    name: "座椅通风"
    description: "控制座椅通风功能"
    
    triggers:
      - "打开座椅通风"
      - "关闭座椅通风"
      - "座椅通风{level}档"
      - "座椅凉快一点"
      
    parameters:
      - name: seat
        type: enum
        required: false
        default: "driver"
        options:
          - value: "driver"
            aliases: ["驾驶位", "主驾", "我的"]
          - value: "passenger"
            aliases: ["副驾驶", "副驾"]
        description: "座椅位置"
        
      - name: level
        type: number
        required: false
        min: 0
        max: 3
        default: 2
        description: "通风档位（0=关闭，1-3=档位）"
    
    action:
      id: "seats.setCooling"
      payload_template:
        seat: "${seat}"
        level: "${level}"
        
    responses:
      success: "好的，${seat}座椅通风已设置为${level}档"

  - id: seats.massage
    category: seats
    name: "座椅按摩"
    description: "控制座椅按摩功能"
    
    triggers:
      - "打开座椅按摩"
      - "关闭座椅按摩"
      - "按摩{mode}模式"
      
    parameters:
      - name: seat
        type: enum
        required: false
        default: "driver"
        options:
          - value: "driver"
            aliases: ["驾驶位", "主驾"]
          - value: "passenger"
            aliases: ["副驾驶", "副驾"]
        description: "座椅位置"
        
      - name: mode
        type: enum
        required: false
        default: "wave"
        options:
          - value: "off"
            aliases: ["关闭", "关"]
          - value: "wave"
            aliases: ["波浪", "舒缓"]
          - value: "pulse"
            aliases: ["脉冲", "活力"]
          - value: "stretch"
            aliases: ["拉伸", "放松"]
        description: "按摩模式"
        
      - name: intensity
        type: number
        required: false
        min: 1
        max: 3
        default: 2
        description: "按摩强度"
    
    action:
      id: "seats.setMassage"
      payload_template:
        seat: "${seat}"
        mode: "${mode}"
        intensity: "${intensity}"
        
    responses:
      success: "好的，${seat}座椅按摩已设置为${mode}模式"

  - id: seats.position
    category: seats
    name: "座椅位置"
    description: "调节座椅位置或加载预设"
    
    triggers:
      - "座椅往前"
      - "座椅往后"
      - "座椅高一点"
      - "座椅低一点"
      - "加载座椅记忆{preset}"
      - "座椅位置{preset}"
      
    parameters:
      - name: adjustment
        type: enum
        required: false
        options:
          - value: "forward"
            aliases: ["往前", "前移"]
          - value: "backward"
            aliases: ["往后", "后移"]
          - value: "up"
            aliases: ["高一点", "升高"]
          - value: "down"
            aliases: ["低一点", "降低"]
          - value: "recline_back"
            aliases: ["靠背后仰", "躺一点"]
          - value: "recline_forward"
            aliases: ["靠背前倾", "坐直"]
        description: "调节方向"
        
      - name: preset
        type: number
        required: false
        min: 1
        max: 3
        description: "预设位置编号"
    
    action:
      id: "seats.adjustPosition"
      payload_template:
        adjustment: "${adjustment}"
        preset: "${preset}"
        
    responses:
      success: "好的，座椅位置已调节"

  # ==========================================
  # Lighting Skills (灯光控制)
  # ==========================================
  - id: lighting.interior
    category: lighting
    name: "车内灯光"
    description: "控制车内照明灯"
    
    triggers:
      - "打开车内灯"
      - "关闭车内灯"
      - "开灯"
      - "关灯"
      - "调亮车内灯"
      - "调暗车内灯"
      
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["打开", "开"]
          - value: "off"
            aliases: ["关闭", "关"]
          - value: "dim"
            aliases: ["调暗", "暗一点"]
          - value: "bright"
            aliases: ["调亮", "亮一点"]
        description: "操作类型"
        
      - name: brightness
        type: number
        required: false
        min: 0
        max: 100
        unit: "%"
        description: "亮度百分比"
    
    action:
      id: "lighting.setInterior"
      payload_template:
        action: "${action}"
        brightness: "${brightness}"
        
    responses:
      success: "好的，车内灯已${action}"

  - id: lighting.ambient
    category: lighting
    name: "氛围灯"
    description: "控制氛围灯颜色和亮度"
    
    triggers:
      - "把氛围灯调成{color}"
      - "氛围灯{color}色"
      - "打开氛围灯"
      - "关闭氛围灯"
      - "换个氛围灯颜色"
      
    parameters:
      - name: action
        type: enum
        required: false
        default: "set"
        options:
          - value: "on"
            aliases: ["打开", "开"]
          - value: "off"
            aliases: ["关闭", "关"]
          - value: "set"
            aliases: ["设置", "调成"]
        description: "操作类型"
        
      - name: color
        type: enum
        required: false
        default: "#3B82F6"
        options:
          - value: "#3B82F6"
            aliases: ["蓝色", "蓝", "海洋蓝"]
          - value: "#EF4444"
            aliases: ["红色", "红", "热情红"]
          - value: "#22C55E"
            aliases: ["绿色", "绿", "森林绿"]
          - value: "#F97316"
            aliases: ["橙色", "橙", "暖橙"]
          - value: "#A855F7"
            aliases: ["紫色", "紫", "神秘紫"]
          - value: "#EC4899"
            aliases: ["粉色", "粉", "浪漫粉"]
          - value: "#FFFFFF"
            aliases: ["白色", "白"]
          - value: "#FCD34D"
            aliases: ["黄色", "黄", "暖黄"]
          - value: "#06B6D4"
            aliases: ["青色", "青", "冰蓝"]
        description: "氛围灯颜色"
            
      - name: brightness
        type: number
        required: false
        min: 0
        max: 100
        default: 80
        unit: "%"
        description: "亮度百分比"
    
    action:
      id: "lighting.setAmbient"
      payload_template:
        action: "${action}"
        color: "${color}"
        brightness: "${brightness}"
        
    responses:
      success: "好的，氛围灯已设置为${color}"

  - id: lighting.reading
    category: lighting
    name: "阅读灯"
    description: "控制阅读灯"
    
    triggers:
      - "打开阅读灯"
      - "关闭阅读灯"
      - "打开{position}阅读灯"
      
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["打开", "开"]
          - value: "off"
            aliases: ["关闭", "关"]
        description: "开关动作"
        
      - name: position
        type: enum
        required: false
        default: "driver"
        options:
          - value: "driver"
            aliases: ["驾驶位", "主驾", "我的"]
          - value: "passenger"
            aliases: ["副驾驶", "副驾"]
          - value: "rear"
            aliases: ["后排"]
        description: "阅读灯位置"
    
    action:
      id: "lighting.setReading"
      payload_template:
        action: "${action}"
        position: "${position}"
        
    responses:
      success: "好的，${position}阅读灯已${action}"

  # ==========================================
  # Media Skills (媒体控制)
  # ==========================================
  - id: media.volume
    category: media
    name: "音量控制"
    description: "调节媒体音量"
    
    triggers:
      - "音量调到{level}"
      - "大声一点"
      - "小声一点"
      - "静音"
      - "取消静音"
      
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "set"
            aliases: ["设置", "调到"]
          - value: "up"
            aliases: ["大声", "调高", "加大"]
          - value: "down"
            aliases: ["小声", "调低", "减小"]
          - value: "mute"
            aliases: ["静音"]
          - value: "unmute"
            aliases: ["取消静音", "恢复声音"]
        description: "音量操作"
        
      - name: level
        type: number
        required: false
        min: 0
        max: 100
        description: "音量级别（0-100）"
    
    action:
      id: "media.setVolume"
      payload_template:
        action: "${action}"
        level: "${level}"
        
    responses:
      success: "好的，音量已${action}"

  - id: media.source
    category: media
    name: "音源切换"
    description: "切换媒体播放源"
    
    triggers:
      - "切换到{source}"
      - "播放{source}"
      - "打开蓝牙音乐"
      - "打开收音机"
      
    parameters:
      - name: source
        type: enum
        required: true
        options:
          - value: "bluetooth"
            aliases: ["蓝牙", "蓝牙音乐", "手机音乐"]
          - value: "radio"
            aliases: ["收音机", "FM", "广播"]
          - value: "usb"
            aliases: ["USB", "U盘"]
          - value: "aux"
            aliases: ["AUX", "辅助输入"]
          - value: "online"
            aliases: ["在线音乐", "网络音乐"]
        description: "音源类型"
    
    action:
      id: "media.setSource"
      payload_template:
        source: "${source}"
        
    responses:
      success: "好的，已切换到${source}"

  - id: media.playback
    category: media
    name: "播放控制"
    description: "控制媒体播放"
    
    triggers:
      - "播放"
      - "暂停"
      - "下一首"
      - "上一首"
      - "停止播放"
      
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "play"
            aliases: ["播放", "继续"]
          - value: "pause"
            aliases: ["暂停"]
          - value: "stop"
            aliases: ["停止"]
          - value: "next"
            aliases: ["下一首", "下一曲"]
          - value: "previous"
            aliases: ["上一首", "上一曲"]
        description: "播放操作"
    
    action:
      id: "media.playback"
      payload_template:
        action: "${action}"
        
    responses:
      success: "好的"

  # ==========================================
  # Info Skills (信息查询)
  # ==========================================
  - id: info.vehicle_status
    category: info
    name: "车辆状态"
    description: "查询车辆整体状态"
    
    triggers:
      - "车辆状态"
      - "汽车状态怎么样"
      - "车况如何"
      
    parameters: []
    
    action:
      id: "info.getVehicleStatus"
      payload_template: {}
      
    returns:
      type: object
      properties:
        speed:
          type: number
          description: "当前车速"
        fuel:
          type: number
          description: "油量百分比"
        range:
          type: number
          description: "续航里程"
        odometer:
          type: number
          description: "总里程"
        
    responses:
      success: "当前车速${speed}公里每小时，油量${fuel}%，续航${range}公里"

  - id: info.tire_pressure
    category: info
    name: "胎压查询"
    description: "查询轮胎气压"
    
    triggers:
      - "胎压多少"
      - "轮胎气压"
      - "查看胎压"
      
    parameters: []
    
    action:
      id: "info.getTirePressure"
      payload_template: {}
      
    returns:
      type: object
      properties:
        front_left:
          type: number
          description: "左前轮胎压"
        front_right:
          type: number
          description: "右前轮胎压"
        rear_left:
          type: number
          description: "左后轮胎压"
        rear_right:
          type: number
          description: "右后轮胎压"
        
    responses:
      success: "左前${front_left}kPa，右前${front_right}kPa，左后${rear_left}kPa，右后${rear_right}kPa，胎压正常"

