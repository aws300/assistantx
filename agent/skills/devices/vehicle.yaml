metadata:
  device_type: vehicle
  device_name: "智能座舱"
  version: "1.0.0"
  language: zh-CN
  description: "车载语音控制系统技能配置"

settings:
  session_timeout_minutes: 5
  confirmation_required: false
  default_zone: "driver"

categories:
  - id: hvac
    name: "空调控制"
    icon: "thermometer"
    description: "温度、风速、空调模式控制"
  - id: windows
    name: "车窗控制"
    icon: "square"
    description: "车窗、天窗开关控制"
  - id: seats
    name: "座椅控制"
    icon: "armchair"
    description: "座椅加热、通风、位置调节"
  - id: lighting
    name: "灯光控制"
    icon: "lightbulb"
    description: "车内灯光、氛围灯控制"
  - id: media
    name: "媒体控制"
    icon: "music"
    description: "音量、音源控制"
  - id: info
    name: "信息查询"
    icon: "info"
    description: "车辆状态信息查询"
  - id: session
    name: "会话控制"
    icon: "power"
    description: "语音会话管理，包括退出、关闭等"

skills:
  - id: hvac.set_temperature
    category: hvac
    name: "设置温度"
    description: "设置车内空调温度，支持分区控制"
    triggers:
      - "把温度调到{temperature}度"
      - "设置温度{temperature}"
      - "空调{temperature}度"
    parameters:
      - name: temperature
        type: number
        required: true
        min: 16
        max: 30
        unit: "°C"
      - name: zone
        type: enum
        required: false
        default: "all"
        options:
          - value: "all"
            aliases: ["全部", "所有"]
          - value: "driver"
            aliases: ["驾驶位", "主驾"]
          - value: "passenger"
            aliases: ["副驾驶", "副驾"]
    action:
      id: "hvac.setTemperature"
      payload_template:
        temperature: "${temperature}"
        zone: "${zone}"
    responses:
      success: "好的，已将${zone}温度设置为${temperature}度"

  - id: hvac.toggle_ac
    category: hvac
    name: "空调开关"
    description: "打开或关闭空调"
    triggers:
      - "打开空调"
      - "关闭空调"
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["打开", "开"]
          - value: "off"
            aliases: ["关闭", "关"]
    action:
      id: "hvac.toggleAC"
      payload_template:
        action: "${action}"
    responses:
      success: "好的，空调已${action}"

  - id: hvac.set_fan_speed
    category: hvac
    name: "设置风速"
    description: "设置空调风扇速度"
    triggers:
      - "风速调到{speed}档"
      - "风大一点"
      - "风小一点"
    parameters:
      - name: speed
        type: enum
        required: true
        options:
          - value: "auto"
            aliases: ["自动"]
          - value: "1"
            aliases: ["一档", "低"]
          - value: "2"
            aliases: ["二档", "中"]
          - value: "3"
            aliases: ["三档", "高"]
    action:
      id: "hvac.setFanSpeed"
      payload_template:
        speed: "${speed}"
    responses:
      success: "好的，风速已设置为${speed}"

  - id: hvac.get_temperature
    category: hvac
    name: "查询温度"
    description: "查询当前车内空调温度设置和车外温度"
    triggers:
      - "空调温度多少"
      - "现在温度是多少"
      - "车内温度"
      - "温度多少度"
      - "查询温度"
    parameters: []
    action:
      id: "hvac.getTemperature"
      payload_template: {}
    responses:
      success: "当前车内温度${current}度，目标温度${target}度，车外温度${outside}度"

  - id: windows.control
    category: windows
    name: "车窗控制"
    description: "打开或关闭车窗"
    triggers:
      - "打开{window}车窗"
      - "关闭{window}车窗"
      - "开窗"
      - "关窗"
    parameters:
      - name: window
        type: enum
        required: false
        default: "all"
        options:
          - value: "all"
            aliases: ["所有", "全部"]
          - value: "front_left"
            aliases: ["左前", "驾驶位"]
          - value: "front_right"
            aliases: ["右前", "副驾驶"]
          - value: "sunroof"
            aliases: ["天窗"]
      - name: action
        type: enum
        required: true
        options:
          - value: "open"
            aliases: ["打开", "开"]
          - value: "close"
            aliases: ["关闭", "关"]
      - name: position
        type: number
        required: false
        min: 0
        max: 100
        default: 100
    action:
      id: "windows.control"
      payload_template:
        window: "${window}"
        action: "${action}"
        position: "${position}"
    responses:
      success: "好的，${window}车窗已${action}"

  - id: seats.heating
    category: seats
    name: "座椅加热"
    description: "控制座椅加热功能"
    triggers:
      - "打开座椅加热"
      - "关闭座椅加热"
      - "座椅加热{level}档"
    parameters:
      - name: seat
        type: enum
        required: false
        default: "driver"
        options:
          - value: "driver"
            aliases: ["驾驶位", "主驾"]
          - value: "passenger"
            aliases: ["副驾驶", "副驾"]
      - name: level
        type: number
        required: false
        min: 0
        max: 3
        default: 2
    action:
      id: "seats.setHeating"
      payload_template:
        seat: "${seat}"
        level: "${level}"
    responses:
      success: "好的，${seat}座椅加热已设置为${level}档"

  - id: seats.cooling
    category: seats
    name: "座椅通风"
    description: "控制座椅通风功能"
    triggers:
      - "打开座椅通风"
      - "关闭座椅通风"
    parameters:
      - name: seat
        type: enum
        required: false
        default: "driver"
        options:
          - value: "driver"
            aliases: ["驾驶位", "主驾"]
          - value: "passenger"
            aliases: ["副驾驶", "副驾"]
      - name: level
        type: number
        required: false
        min: 0
        max: 3
        default: 2
    action:
      id: "seats.setCooling"
      payload_template:
        seat: "${seat}"
        level: "${level}"
    responses:
      success: "好的，${seat}座椅通风已设置为${level}档"

  - id: lighting.interior
    category: lighting
    name: "车内灯光"
    description: "控制车内照明灯"
    triggers:
      - "打开车内灯"
      - "关闭车内灯"
      - "开灯"
      - "关灯"
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["打开", "开"]
          - value: "off"
            aliases: ["关闭", "关"]
      - name: brightness
        type: number
        required: false
        min: 0
        max: 100
    action:
      id: "lighting.setInterior"
      payload_template:
        action: "${action}"
        brightness: "${brightness}"
    responses:
      success: "好的，车内灯已${action}"

  - id: lighting.ambient
    category: lighting
    name: "氛围灯"
    description: "控制氛围灯颜色和亮度"
    triggers:
      - "把氛围灯调成{color}"
      - "打开氛围灯"
      - "关闭氛围灯"
    parameters:
      - name: action
        type: enum
        required: false
        default: "set"
        options:
          - value: "on"
            aliases: ["打开", "开"]
          - value: "off"
            aliases: ["关闭", "关"]
          - value: "set"
            aliases: ["设置", "调成"]
      - name: color
        type: enum
        required: false
        default: "#3B82F6"
        options:
          - value: "#3B82F6"
            aliases: ["蓝色", "蓝"]
          - value: "#EF4444"
            aliases: ["红色", "红"]
          - value: "#22C55E"
            aliases: ["绿色", "绿"]
          - value: "#A855F7"
            aliases: ["紫色", "紫"]
          - value: "#F97316"
            aliases: ["橙色", "橙"]
          - value: "#EC4899"
            aliases: ["粉色", "粉"]
          - value: "#6B7280"
            aliases: ["白色", "白"]
      - name: brightness
        type: number
        required: false
        min: 0
        max: 100
        default: 80
    action:
      id: "lighting.setAmbient"
      payload_template:
        action: "${action}"
        color: "${color}"
        brightness: "${brightness}"
    responses:
      success: "好的，氛围灯已设置为${color}"

  - id: media.volume
    category: media
    name: "音量控制"
    description: "调节媒体音量"
    triggers:
      - "音量调到{level}"
      - "大声一点"
      - "小声一点"
      - "静音"
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "set"
            aliases: ["设置", "调到"]
          - value: "up"
            aliases: ["大声", "调高"]
          - value: "down"
            aliases: ["小声", "调低"]
          - value: "mute"
            aliases: ["静音"]
      - name: level
        type: number
        required: false
        min: 0
        max: 100
    action:
      id: "media.setVolume"
      payload_template:
        action: "${action}"
        level: "${level}"
    responses:
      success: "好的，音量已${action}"

  - id: info.vehicle_status
    category: info
    name: "车辆状态"
    description: "查询电动车整体状态，包括电量、续航里程等"
    triggers:
      - "车辆状态"
      - "汽车状态怎么样"
      - "电量多少"
      - "还有多少电"
      - "续航多少"
      - "还能跑多远"
      - "剩余电量"
      - "电池状态"
    parameters: []
    action:
      id: "info.getVehicleStatus"
      payload_template: {}
    responses:
      success: "当前车速${speed}公里每小时，剩余电量${battery}%，预计续航${range}公里"

  - id: session.exit
    category: session
    name: "退出会话"
    description: "结束当前语音会话，断开连接"
    triggers:
      - "关闭"
      - "退出"
      - "退下"
      - "再见"
      - "拜拜"
      - "结束对话"
      - "结束会话"
      - "断开连接"
      - "关闭语音助手"
      - "退出语音"
      - "不用了"
      - "没事了"
      - "好了"
      - "quit"
      - "exit"
      - "turn off"
      - "bye"
    parameters: []
    action:
      id: "session.disconnect"
      payload_template:
        command: "disconnect"
    responses:
      success: "好的，再见！"

rag_queries:
  - id: vehicle_manual
    name: "车辆手册查询"
    description: "查询车辆使用手册中的信息"
    knowledge_base_id: "FHRCYNULOS"
    region: "us-west-2"
    triggers:
      - "怎么{action}"
      - "{feature}在哪里"
      - "如何使用{feature}"
      - "{feature}怎么用"
      - "告诉我关于{topic}"
    responses:
      success: "${answer}"
      not_found: "抱歉，我在手册中没有找到相关信息"
      error: "查询出错，请稍后重试"
