metadata:
  device_type: ev_charger
  device_name: "智能充电桩"
  version: "1.0.0"
  language: zh-CN
  description: "电动汽车充电桩语音控制系统技能配置"

settings:
  session_timeout_minutes: 5
  confirmation_required: false

categories:
  - id: charging
    name: "充电控制"
    icon: "zap"
    description: "开始、停止、暂停充电操作"
  - id: settings
    name: "充电设置"
    icon: "settings"
    description: "目标电量等设置"
  - id: info
    name: "信息查询"
    icon: "info"
    description: "充电状态、电气数据、温度查询"
  - id: session
    name: "会话控制"
    icon: "power"
    description: "语音会话管理，包括退出、关闭等"

skills:
  - id: charger.start
    category: charging
    name: "开始充电"
    description: "启动充电桩开始充电"
    triggers:
      - "开始充电"
      - "启动充电"
      - "充电"
      - "开充"
    parameters: []
    action:
      id: "charger.start"
      payload_template: {}
    responses:
      success: "好的，充电已启动"

  - id: charger.stop
    category: charging
    name: "停止充电"
    description: "停止当前充电"
    triggers:
      - "停止充电"
      - "结束充电"
      - "停充"
      - "充电完成"
    parameters: []
    action:
      id: "charger.stop"
      payload_template: {}
    responses:
      success: "好的，充电已停止"

  - id: charger.pause
    category: charging
    name: "暂停充电"
    description: "暂停当前充电"
    triggers:
      - "暂停充电"
      - "暂停"
    parameters: []
    action:
      id: "charger.pause"
      payload_template: {}
    responses:
      success: "好的，充电已暂停"

  - id: charger.resume
    category: charging
    name: "继续充电"
    description: "恢复暂停的充电"
    triggers:
      - "继续充电"
      - "恢复充电"
    parameters: []
    action:
      id: "charger.resume"
      payload_template: {}
    responses:
      success: "好的，充电已恢复"

  - id: charger.set_target_soc
    category: settings
    name: "设置目标电量"
    description: "设置充电目标电量百分比"
    triggers:
      - "充到{percent}%"
      - "充电到{percent}"
      - "目标电量{percent}"
      - "充到{percent}就停"
    parameters:
      - name: percent
        type: number
        required: true
        min: 20
        max: 100
        unit: "%"
    action:
      id: "charger.setTargetSoc"
      payload_template:
        percent: "${percent}"
    responses:
      success: "好的，已设置目标电量为${percent}%，预计还需${estimatedTime}分钟"

  - id: charger.get_status
    category: info
    name: "查询充电状态"
    description: "查询当前充电状态和电量信息"
    triggers:
      - "充电状态"
      - "充了多少"
      - "还要多久"
      - "充到多少了"
      - "电量多少"
      - "充电情况"
    parameters: []
    action:
      id: "charger.getStatus"
      payload_template: {}
    responses:
      success: "当前${status}，电量${soc}%，目标${targetSoc}%，功率${power}kW，预计还需${estimatedTime}分钟，已花费${currentCost}元"

  - id: charger.get_electrical
    category: info
    name: "查询电气数据"
    description: "查询充电桩电压、电流、功率等电气参数"
    triggers:
      - "电气数据"
      - "充电功率"
      - "功率多少"
      - "电压电流"
    parameters: []
    action:
      id: "charger.getElectricalData"
      payload_template: {}
    responses:
      success: "当前功率${power}kW，输出电压${outputVoltage}V，电流${outputCurrent}A，已充${totalEnergy}度电"

  - id: charger.get_temperature
    category: info
    name: "查询温度"
    description: "查询充电桩温度监测数据"
    triggers:
      - "温度多少"
      - "充电桩温度"
      - "枪头温度"
    parameters: []
    action:
      id: "charger.getTemperature"
      payload_template: {}
    responses:
      success: "枪头温度${connector}度，模块温度${module}度，环境温度${ambient}度"

  - id: charger.get_billing
    category: info
    name: "查询费用"
    description: "查询当前充电费用信息"
    triggers:
      - "花了多少钱"
      - "充电费用"
      - "多少钱"
      - "费用多少"
    parameters: []
    action:
      id: "charger.getBilling"
      payload_template: {}
    responses:
      success: "电价${rate}元每度，已充${totalEnergy}度，当前费用${currentCost}元"

  - id: session.exit
    category: session
    name: "退出会话"
    description: "结束当前语音会话，断开连接"
    triggers:
      - "关闭"
      - "退出"
      - "退下"
      - "再见"
      - "拜拜"
      - "结束对话"
      - "结束会话"
      - "断开连接"
      - "关闭语音助手"
      - "退出语音"
      - "不用了"
      - "没事了"
      - "好了"
      - "quit"
      - "exit"
      - "turn off"
      - "bye"
    parameters: []
    action:
      id: "session.disconnect"
      payload_template:
        command: "disconnect"
    responses:
      success: "好的，再见！"
