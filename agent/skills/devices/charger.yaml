metadata:
  device_type: ev_charger
  device_name: "Smart EV Charger"
  version: "1.0.0"
  language: en-US
  description: "Skill configuration for the EV charger voice control system"

settings:
  session_timeout_minutes: 5
  confirmation_required: false

categories:
  - id: charging
    name: "Charging Control"
    icon: "zap"
    description: "Start, stop and pause charging"
  - id: settings
    name: "Charging Settings"
    icon: "settings"
    description: "Settings such as the target charge level"
  - id: info
    name: "Charger Info"
    icon: "info"
    description: "Charging status, electrical data and temperature queries"
  - id: session
    name: "Session Control"
    icon: "power"
    description: "Voice session management, such as exiting or closing"

skills:
  - id: charger.start
    category: charging
    name: "Start Charging"
    description: "Start the charger"
    triggers:
      - "start charging"
      - "begin charging"
      - "charge"
      - "charge now"
    parameters: []
    action:
      id: "charger.start"
      payload_template: {}
    responses:
      success: "OK, charging has started"

  - id: charger.stop
    category: charging
    name: "Stop Charging"
    description: "Stop the current charging session"
    triggers:
      - "stop charging"
      - "end charging"
      - "stop the charge"
      - "charging done"
    parameters: []
    action:
      id: "charger.stop"
      payload_template: {}
    responses:
      success: "OK, charging has stopped"

  - id: charger.pause
    category: charging
    name: "Pause Charging"
    description: "Pause the current charging session"
    triggers:
      - "pause charging"
      - "pause"
    parameters: []
    action:
      id: "charger.pause"
      payload_template: {}
    responses:
      success: "OK, charging is paused"

  - id: charger.resume
    category: charging
    name: "Resume Charging"
    description: "Resume a paused charging session"
    triggers:
      - "resume charging"
      - "continue charging"
    parameters: []
    action:
      id: "charger.resume"
      payload_template: {}
    responses:
      success: "OK, charging has resumed"

  - id: charger.set_target_soc
    category: settings
    name: "Set Target Charge"
    description: "Set the target charge level as a percentage"
    triggers:
      - "charge to {percent}%"
      - "charge up to {percent}"
      - "target charge {percent}"
      - "stop at {percent}"
    parameters:
      - name: percent
        type: number
        required: true
        min: 20
        max: 100
        unit: "%"
    action:
      id: "charger.setTargetSoc"
      payload_template:
        percent: "${percent}"
    responses:
      success: "OK, the target charge is set to ${percent}%, about ${estimatedTime} minutes to go"

  - id: charger.get_status
    category: info
    name: "Check Charging Status"
    description: "Get the current charging status and battery level"
    triggers:
      - "charging status"
      - "how much has it charged"
      - "how long until it's done"
      - "what's the charge level"
      - "battery level"
      - "how is charging going"
    parameters: []
    action:
      id: "charger.getStatus"
      payload_template: {}
    responses:
      success: "Status: ${status}, battery at ${soc}%, target ${targetSoc}%, power ${power} kW, about ${estimatedTime} minutes remaining, ${currentCost} yuan spent so far"

  - id: charger.get_electrical
    category: info
    name: "Check Electrical Data"
    description: "Get the charger's voltage, current, power and other electrical readings"
    triggers:
      - "electrical data"
      - "charging power"
      - "what's the power"
      - "voltage and current"
    parameters: []
    action:
      id: "charger.getElectricalData"
      payload_template: {}
    responses:
      success: "Power is ${power} kW, output voltage ${outputVoltage} V, current ${outputCurrent} A, ${totalEnergy} kWh delivered"

  - id: charger.get_temperature
    category: info
    name: "Check Temperature"
    description: "Get the charger's temperature readings"
    triggers:
      - "what's the temperature"
      - "charger temperature"
      - "connector temperature"
    parameters: []
    action:
      id: "charger.getTemperature"
      payload_template: {}
    responses:
      success: "Connector ${connector} degrees, module ${module} degrees, ambient ${ambient} degrees"

  - id: charger.get_billing
    category: info
    name: "Check Cost"
    description: "Get the current charging cost"
    triggers:
      - "how much has it cost"
      - "charging cost"
      - "how much is it"
      - "what's the cost"
    parameters: []
    action:
      id: "charger.getBilling"
      payload_template: {}
    responses:
      success: "The rate is ${rate} yuan per kWh, ${totalEnergy} kWh delivered, ${currentCost} yuan so far"

  - id: session.exit
    category: session
    name: "Exit Session"
    description: "End the current voice session and disconnect"
    triggers:
      - "close"
      - "exit"
      - "dismiss"
      - "goodbye"
      - "bye bye"
      - "end the conversation"
      - "end the session"
      - "disconnect"
      - "close the voice assistant"
      - "exit voice"
      - "never mind"
      - "that's all"
      - "I'm done"
      - "quit"
      - "exit"
      - "turn off"
      - "bye"
    parameters: []
    action:
      id: "session.disconnect"
      payload_template:
        command: "disconnect"
    responses:
      success: "OK, goodbye!"
