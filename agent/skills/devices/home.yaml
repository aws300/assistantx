metadata:
  device_type: smart_home
  device_name: "Smart Home"
  version: "1.0.0"
  language: en-US
  description: "Skill configuration for the smart home voice control system"

settings:
  session_timeout_minutes: 5
  confirmation_required: false

categories:
  - id: hvac
    name: "Climate Control"
    icon: "thermometer"
    description: "Living room A/C temperature, fan speed and mode control"
  - id: lighting
    name: "Lighting Control"
    icon: "lightbulb"
    description: "Turn the lights in each room on and off"
  - id: curtain
    name: "Curtain Control"
    icon: "curtain"
    description: "Open and close the living room curtains"
  - id: info
    name: "Home Info"
    icon: "info"
    description: "Indoor and outdoor temperature and weather queries"
  - id: session
    name: "Session Control"
    icon: "power"
    description: "Voice session management, such as exiting or closing"

skills:
  - id: hvac.set_temperature
    category: hvac
    name: "Set Temperature"
    description: "Set the living room A/C temperature"
    triggers:
      - "set the temperature to {temperature} degrees"
      - "temperature {temperature}"
      - "A/C to {temperature} degrees"
      - "make it warmer"
      - "make it cooler"
    parameters:
      - name: temperature
        type: number
        required: true
        min: 16
        max: 30
        unit: "°C"
    action:
      id: "hvac.setTemperature"
      payload_template:
        temperature: "${temperature}"
    responses:
      success: "OK, the A/C is set to ${temperature} degrees"

  - id: hvac.toggle_ac
    category: hvac
    name: "A/C On/Off"
    description: "Turn the A/C on or off"
    triggers:
      - "turn on the A/C"
      - "turn off the A/C"
      - "A/C on"
      - "A/C off"
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["turn on", "on"]
          - value: "off"
            aliases: ["turn off", "off"]
    action:
      id: "hvac.setPower"
      payload_template:
        action: "${action}"
    responses:
      success: "OK, the A/C is ${action}"

  - id: hvac.set_mode
    category: hvac
    name: "Set Mode"
    description: "Set the A/C operating mode"
    triggers:
      - "switch to {mode} mode"
      - "turn on {mode}"
      - "cooling mode"
      - "heating mode"
      - "auto mode"
    parameters:
      - name: mode
        type: enum
        required: true
        options:
          - value: "cool"
            aliases: ["cool", "cooling", "cold air"]
          - value: "heat"
            aliases: ["heat", "heating", "warm air", "heater"]
          - value: "auto"
            aliases: ["auto"]
          - value: "fan"
            aliases: ["fan", "fan only"]
          - value: "dry"
            aliases: ["dry", "dehumidify"]
    action:
      id: "hvac.setMode"
      payload_template:
        mode: "${mode}"
    responses:
      success: "OK, the A/C is now in ${mode} mode"

  - id: hvac.set_fan_speed
    category: hvac
    name: "Set Fan Speed"
    description: "Set the A/C fan speed"
    triggers:
      - "set the fan to {speed}"
      - "more air"
      - "less air"
      - "{speed} fan"
    parameters:
      - name: speed
        type: enum
        required: true
        options:
          - value: "auto"
            aliases: ["auto"]
          - value: "low"
            aliases: ["low", "gentle", "level one"]
          - value: "medium"
            aliases: ["medium", "level two"]
          - value: "high"
            aliases: ["high", "strong", "level three"]
    action:
      id: "hvac.setFanSpeed"
      payload_template:
        speed: "${speed}"
    responses:
      success: "OK, the fan speed is set to ${speed}"

  - id: hvac.get_temperature
    category: hvac
    name: "Check Temperature"
    description: "Get the current indoor A/C temperature setting and the outdoor temperature"
    triggers:
      - "what is the A/C temperature"
      - "what's the temperature now"
      - "indoor temperature"
      - "how warm is it"
      - "check the temperature"
    parameters: []
    action:
      id: "hvac.getTemperature"
      payload_template: {}
    responses:
      success: "It is ${inside} degrees inside, the target is ${target} degrees, and it is ${outside} degrees outside"

  - id: hvac.get_status
    category: hvac
    name: "Check A/C Status"
    description: "Get the overall A/C operating status"
    triggers:
      - "A/C status"
      - "how is the A/C"
    parameters: []
    action:
      id: "hvac.getStatus"
      payload_template: {}
    responses:
      success: "The A/C is ${power}, set to ${temperature} degrees, in ${mode} mode, with ${fanSpeed} fan speed"

  - id: lighting.control
    category: lighting
    name: "Lighting Control"
    description: "Turn the lights in each room on and off"
    triggers:
      - "turn on the {room} light"
      - "turn off the {room} light"
      - "{room} light on"
      - "{room} light off"
      - "turn on all the lights"
      - "turn off all the lights"
      - "all lights on"
      - "all lights off"
    parameters:
      - name: room
        type: enum
        required: false
        default: "livingRoom"
        options:
          - value: "livingRoom"
            aliases: ["living room", "lounge"]
          - value: "bedroom"
            aliases: ["bedroom", "room"]
          - value: "kitchen"
            aliases: ["kitchen"]
          - value: "bathroom"
            aliases: ["bathroom", "restroom", "toilet"]
          - value: "all"
            aliases: ["all", "every", "whole house"]
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["turn on", "on"]
          - value: "off"
            aliases: ["turn off", "off"]
    action:
      id: "lighting.control"
      payload_template:
        room: "${room}"
        action: "${action}"
    responses:
      success: "OK, the ${room} light is ${action}"

  - id: lighting.get_status
    category: lighting
    name: "Check Light Status"
    description: "Get the light status of each room"
    triggers:
      - "light status"
      - "which lights are on"
    parameters: []
    action:
      id: "lighting.getStatus"
      payload_template: {}
    responses:
      success: "Lights: living room ${livingRoom}, bedroom ${bedroom}, kitchen ${kitchen}, bathroom ${bathroom}"

  - id: curtain.control
    category: curtain
    name: "Curtain Control"
    description: "Open or close the living room curtains"
    triggers:
      - "open the curtains"
      - "close the curtains"
      - "draw the curtains open"
      - "draw the curtains closed"
      - "open the curtains to {position}"
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "open"
            aliases: ["open", "draw open"]
          - value: "close"
            aliases: ["close", "draw closed", "shut"]
      - name: position
        type: number
        required: false
        min: 0
        max: 100
        default: 100
    action:
      id: "curtain.control"
      payload_template:
        action: "${action}"
        position: "${position}"
    responses:
      success: "OK, the curtains are ${action}"

  - id: curtain.get_status
    category: curtain
    name: "Check Curtain Status"
    description: "Get whether the curtains are open or closed"
    triggers:
      - "curtain status"
      - "are the curtains open"
    parameters: []
    action:
      id: "curtain.getStatus"
      payload_template: {}
    responses:
      success: "The curtains are ${position}% open"

  - id: info.get_temperature
    category: info
    name: "Check Indoor and Outdoor Temperature"
    description: "Get the current indoor and outdoor temperature"
    triggers:
      - "indoor and outdoor temperature"
      - "how warm is it inside"
      - "how cold is it outside"
    parameters: []
    action:
      id: "info.getTemperature"
      payload_template: {}
    responses:
      success: "It is ${inside} degrees inside and ${outside} degrees outside"

  - id: info.get_weather
    category: info
    name: "Check Weather"
    description: "Get the current weather"
    triggers:
      - "today's weather"
      - "what's the weather like"
      - "weather outside"
      - "air quality"
    parameters: []
    action:
      id: "info.getWeather"
      payload_template: {}
    responses:
      success: "It is ${weather}, ${outside} degrees outside, humidity ${humidity}%, PM2.5 index ${pm25}"

  - id: info.get_home_status
    category: info
    name: "Check Home Status"
    description: "Get the overall smart home status"
    triggers:
      - "home status"
      - "house status"
      - "room status"
    parameters: []
    action:
      id: "info.getHomeStatus"
      payload_template: {}
    responses:
      success: "It is ${weather}, ${outsideTemp} degrees outside, ${insideTemp} degrees inside, humidity ${humidity}%"

  - id: session.exit
    category: session
    name: "Exit Session"
    description: "End the current voice session and disconnect"
    triggers:
      - "close"
      - "exit"
      - "dismiss"
      - "goodbye"
      - "bye bye"
      - "end the conversation"
      - "end the session"
      - "disconnect"
      - "close the voice assistant"
      - "exit voice"
      - "never mind"
      - "that's all"
      - "I'm done"
      - "quit"
      - "exit"
      - "turn off"
      - "bye"
    parameters: []
    action:
      id: "session.disconnect"
      payload_template:
        command: "disconnect"
    responses:
      success: "OK, goodbye!"
