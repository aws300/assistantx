metadata:
  device_type: smart_home
  device_name: "智能家居"
  version: "1.0.0"
  language: zh-CN
  description: "智能家居语音控制系统技能配置"

settings:
  session_timeout_minutes: 5
  confirmation_required: false

categories:
  - id: hvac
    name: "空调控制"
    icon: "thermometer"
    description: "客厅空调温度、风速、模式控制"
  - id: lighting
    name: "灯光控制"
    icon: "lightbulb"
    description: "各房间灯光开关控制"
  - id: curtain
    name: "窗帘控制"
    icon: "curtain"
    description: "客厅窗帘开关控制"
  - id: info
    name: "信息查询"
    icon: "info"
    description: "室内外温度、天气信息查询"
  - id: session
    name: "会话控制"
    icon: "power"
    description: "语音会话管理，包括退出、关闭等"

skills:
  - id: hvac.set_temperature
    category: hvac
    name: "设置温度"
    description: "设置客厅空调温度"
    triggers:
      - "把温度调到{temperature}度"
      - "设置温度{temperature}"
      - "空调{temperature}度"
      - "调高温度"
      - "调低温度"
    parameters:
      - name: temperature
        type: number
        required: true
        min: 16
        max: 30
        unit: "°C"
    action:
      id: "hvac.setTemperature"
      payload_template:
        temperature: "${temperature}"
    responses:
      success: "好的，已将空调温度设置为${temperature}度"

  - id: hvac.toggle_ac
    category: hvac
    name: "空调开关"
    description: "打开或关闭空调"
    triggers:
      - "打开空调"
      - "关闭空调"
      - "开空调"
      - "关空调"
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["打开", "开"]
          - value: "off"
            aliases: ["关闭", "关"]
    action:
      id: "hvac.setPower"
      payload_template:
        action: "${action}"
    responses:
      success: "好的，空调已${action}"

  - id: hvac.set_mode
    category: hvac
    name: "设置模式"
    description: "设置空调运行模式"
    triggers:
      - "切换到{mode}模式"
      - "开{mode}"
      - "制冷模式"
      - "制热模式"
      - "自动模式"
    parameters:
      - name: mode
        type: enum
        required: true
        options:
          - value: "cool"
            aliases: ["制冷", "冷气", "冷风"]
          - value: "heat"
            aliases: ["制热", "暖气", "暖风", "取暖"]
          - value: "auto"
            aliases: ["自动"]
          - value: "fan"
            aliases: ["送风", "风扇"]
          - value: "dry"
            aliases: ["除湿"]
    action:
      id: "hvac.setMode"
      payload_template:
        mode: "${mode}"
    responses:
      success: "好的，空调已切换到${mode}模式"

  - id: hvac.set_fan_speed
    category: hvac
    name: "设置风速"
    description: "设置空调风扇速度"
    triggers:
      - "风速调到{speed}"
      - "风大一点"
      - "风小一点"
      - "{speed}风"
    parameters:
      - name: speed
        type: enum
        required: true
        options:
          - value: "auto"
            aliases: ["自动"]
          - value: "low"
            aliases: ["低", "小", "一档"]
          - value: "medium"
            aliases: ["中", "二档"]
          - value: "high"
            aliases: ["高", "大", "三档"]
    action:
      id: "hvac.setFanSpeed"
      payload_template:
        speed: "${speed}"
    responses:
      success: "好的，风速已设置为${speed}"

  - id: hvac.get_temperature
    category: hvac
    name: "查询温度"
    description: "查询当前室内空调温度设置和室外温度"
    triggers:
      - "空调温度多少"
      - "现在温度是多少"
      - "室内温度"
      - "温度多少度"
      - "查询温度"
    parameters: []
    action:
      id: "hvac.getTemperature"
      payload_template: {}
    responses:
      success: "当前室内温度${inside}度，目标温度${target}度，室外温度${outside}度"

  - id: hvac.get_status
    category: hvac
    name: "查询空调状态"
    description: "查询空调整体运行状态"
    triggers:
      - "空调状态"
      - "空调怎么样"
    parameters: []
    action:
      id: "hvac.getStatus"
      payload_template: {}
    responses:
      success: "空调当前${power}，温度${temperature}度，${mode}模式，风速${fanSpeed}"

  - id: lighting.control
    category: lighting
    name: "灯光控制"
    description: "控制各房间灯光开关"
    triggers:
      - "打开{room}灯"
      - "关闭{room}灯"
      - "开{room}灯"
      - "关{room}灯"
      - "打开所有灯"
      - "关闭所有灯"
      - "全部开灯"
      - "全部关灯"
    parameters:
      - name: room
        type: enum
        required: false
        default: "livingRoom"
        options:
          - value: "livingRoom"
            aliases: ["客厅", "大厅"]
          - value: "bedroom"
            aliases: ["卧室", "房间"]
          - value: "kitchen"
            aliases: ["厨房"]
          - value: "bathroom"
            aliases: ["卫生间", "洗手间", "厕所"]
          - value: "all"
            aliases: ["所有", "全部", "全屋"]
      - name: action
        type: enum
        required: true
        options:
          - value: "on"
            aliases: ["打开", "开"]
          - value: "off"
            aliases: ["关闭", "关"]
    action:
      id: "lighting.control"
      payload_template:
        room: "${room}"
        action: "${action}"
    responses:
      success: "好的，${room}灯已${action}"

  - id: lighting.get_status
    category: lighting
    name: "查询灯光状态"
    description: "查询各房间灯光状态"
    triggers:
      - "灯光状态"
      - "哪些灯开着"
    parameters: []
    action:
      id: "lighting.getStatus"
      payload_template: {}
    responses:
      success: "当前灯光状态：客厅${livingRoom}，卧室${bedroom}，厨房${kitchen}，卫生间${bathroom}"

  - id: curtain.control
    category: curtain
    name: "窗帘控制"
    description: "控制客厅窗帘开关"
    triggers:
      - "打开窗帘"
      - "关闭窗帘"
      - "拉开窗帘"
      - "拉上窗帘"
      - "窗帘开到{position}"
    parameters:
      - name: action
        type: enum
        required: true
        options:
          - value: "open"
            aliases: ["打开", "拉开", "开"]
          - value: "close"
            aliases: ["关闭", "拉上", "关"]
      - name: position
        type: number
        required: false
        min: 0
        max: 100
        default: 100
    action:
      id: "curtain.control"
      payload_template:
        action: "${action}"
        position: "${position}"
    responses:
      success: "好的，窗帘已${action}"

  - id: curtain.get_status
    category: curtain
    name: "查询窗帘状态"
    description: "查询窗帘开关状态"
    triggers:
      - "窗帘状态"
      - "窗帘开了吗"
    parameters: []
    action:
      id: "curtain.getStatus"
      payload_template: {}
    responses:
      success: "窗帘当前开度${position}%"

  - id: info.get_temperature
    category: info
    name: "查询室内外温度"
    description: "查询当前室内外温度"
    triggers:
      - "室内外温度"
      - "屋里多少度"
      - "外面多少度"
    parameters: []
    action:
      id: "info.getTemperature"
      payload_template: {}
    responses:
      success: "当前室内温度${inside}度，室外温度${outside}度"

  - id: info.get_weather
    category: info
    name: "查询天气"
    description: "查询当前天气状况"
    triggers:
      - "今天天气"
      - "天气怎么样"
      - "外面天气"
      - "空气质量"
    parameters: []
    action:
      id: "info.getWeather"
      payload_template: {}
    responses:
      success: "当前天气${weather}，室外温度${outside}度，湿度${humidity}%，PM2.5指数${pm25}"

  - id: info.get_home_status
    category: info
    name: "查询家居状态"
    description: "查询智能家居整体状态"
    triggers:
      - "家里状态"
      - "家居状态"
      - "房间状态"
    parameters: []
    action:
      id: "info.getHomeStatus"
      payload_template: {}
    responses:
      success: "当前${weather}，室外${outsideTemp}度，室内${insideTemp}度，湿度${humidity}%"

  - id: session.exit
    category: session
    name: "退出会话"
    description: "结束当前语音会话，断开连接"
    triggers:
      - "关闭"
      - "退出"
      - "退下"
      - "再见"
      - "拜拜"
      - "结束对话"
      - "结束会话"
      - "断开连接"
      - "关闭语音助手"
      - "退出语音"
      - "不用了"
      - "没事了"
      - "好了"
      - "quit"
      - "exit"
      - "turn off"
      - "bye"
    parameters: []
    action:
      id: "session.disconnect"
      payload_template:
        command: "disconnect"
    responses:
      success: "好的，再见！"
